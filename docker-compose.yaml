# docker-compose.yaml
# ============================================================
# Orkestrasi Layanan MLOps dengan Monitoring Stack
# AAPL Stock Price Prediction - LK-11
# Rafly Januar Raharjo - 235150201111011 | MLOps Kelas B
# ============================================================

services:

  # ============================================================
  # LAYANAN 1: MLflow Tracking Server
  # ============================================================
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mlflow-server
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow
      - ./mlruns:/mlflow/mlruns
      - ./models:/mlflow/models
    networks:
      - mlops-network
    restart: unless-stopped

  # ============================================================
  # LAYANAN 2: FastAPI Inferensi Model (3 Replika)
  # ============================================================
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - MODEL_NAME=AAPL-RF-Production
      - MODEL_ALIAS=production
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow.db:/app/mlflow.db
      - mlflow-db:/mlflow
    networks:
      - mlops-network
    depends_on:
      - mlflow-server

  # ============================================================
  # LAYANAN 3: Nginx Load Balancer
  # ============================================================
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "8000:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mlops-network
    depends_on:
      - api-service
    restart: unless-stopped

  # ============================================================
  # LAYANAN 4: Prometheus (LK-11)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - mlops-network
    restart: unless-stopped

  # ============================================================
  # LAYANAN 5: Grafana (LK-11)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mlops-network
    restart: unless-stopped

# ============================================================
# NETWORK
# ============================================================
networks:
  mlops-network:
    driver: bridge
    name: mlops-network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  mlflow-db:
    name: mlops-mlflow-db
  prometheus-data:
    name: mlops-prometheus-data
  grafana-data:
    name: mlops-grafana-data