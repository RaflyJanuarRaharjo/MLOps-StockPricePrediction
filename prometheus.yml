# prometheus.yml - Update LK-12
# Ditambahkan alerting rules untuk Continuous Training trigger
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ============================================================
# ALERTING RULES (LK-12)
# ============================================================
rule_files:
  - "alert_rules.yml"

# Alertmanager config (opsional - untuk notifikasi)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aapl-api'
    static_configs:
      - targets: ['load-balancer:80']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'aapl-api-replicas'
    dns_sd_configs:
      - names:
          - 'api-service'
        type: 'A'
        port: 8080
    metrics_path: '/metrics'
    scrape_interval: 10s
